<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7xvhp3o0B3Keg-3V2vEIEuzMF3-TVsVTOIYjWYOlmaE9zSzWpwyTF3KfLBfZZYSNQ/exec";
    const video = document.getElementById('video');
    const statusBox = document.getElementById('statusBox');

    let faceMatcher = null;
    let isProcessing = false;
    
    // Menyimpan daftar nama siswa yang SUDAH berhasil absen hari ini
    let sudahAbsenList = new Set();

    async function startVideo() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = stream;
      } catch (err) {
        statusBox.style.background = "#ffebee";
        statusBox.style.color = "#c62828";
        statusBox.innerText = "Gagal mengakses kamera: " + err.message;
      }
    }

    async function init() {
      await startVideo();
      try {
        const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

        await muatDataSiswa();
      } catch (err) {
        statusBox.style.background = "#ffebee";
        statusBox.style.color = "#c62828";
        statusBox.innerText = "Gagal memuat AI: " + err.message;
      }
    }

    async function muatDataSiswa() {
      const kelas = document.getElementById('pilihKelas').value;
      
      // Reset daftar nama yang sudah absen tiap kali ganti kelas
      sudahAbsenList.clear();

      statusBox.style.background = "#e8f5e9";
      statusBox.style.color = "#1b5e20";
      statusBox.innerText = `Memuat data siswa ${kelas}...`;

      try {
        const res = await fetch(`${SCRIPT_URL}?action=getDataSiswa&kelas=${encodeURIComponent(kelas)}`);
        const result = await res.json();

        if (!result || result.length === 0) {
          faceMatcher = null;
          statusBox.innerText = `Belum ada data siswa terdaftar di ${kelas}.`;
          return;
        }

        const labeledDescriptors = [];
        result.forEach(siswa => {
          if (siswa.descriptor) {
            try {
              let cleanDesc = siswa.descriptor;
              if (cleanDesc.startsWith('"') && cleanDesc.endsWith('"')) {
                cleanDesc = cleanDesc.substring(1, cleanDesc.length - 1);
              }
              const descriptorArray = JSON.parse(cleanDesc);
              const float32Array = new Float32Array(descriptorArray);
              labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(siswa.nama, [float32Array]));
            } catch (e) {
              console.error("Gagal parse descriptor:", siswa.nama);
            }
          }
        });

        if (labeledDescriptors.length === 0) {
          faceMatcher = null;
          statusBox.innerText = `Tidak ada data wajah valid di ${kelas}.`;
          return;
        }

        faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
        statusBox.innerText = `Sistem Siap! Silakan berdiri di depan kamera.`;

        mulaiScanOtomatis();

      } catch (err) {
        console.error(err);
        statusBox.style.background = "#ffebee";
        statusBox.style.color = "#c62828";
        statusBox.innerText = "Gagal memuat data siswa dari server.";
      }
    }

    function mulaiScanOtomatis() {
      setInterval(async () => {
        if (isProcessing || !faceMatcher) return;

        const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();

        if (detection) {
          const match = faceMatcher.findBestMatch(detection.descriptor);

          if (match.label !== 'unknown') {
            const namaSiswa = match.label;
            const kelasSiswa = document.getElementById('pilihKelas').value;

            // KELOLA PENGECEKAN: Apakah nama ini SUDAH absen sebelumnya?
            if (sudahAbsenList.has(namaSiswa)) {
              statusBox.style.background = "#fff3e0";
              statusBox.style.color = "#e65100";
              statusBox.innerText = `⚠️ ${namaSiswa} sudah melakukan presensi!`;
              return; // Stop, jangan kirim data lagi ke Google Sheets
            }

            // JIKA BELUM ABSEN:
            isProcessing = true; // Kunci sebentar saat kirim data

            // Masukkan nama ke daftar yang sudah absen
            sudahAbsenList.add(namaSiswa);

            statusBox.style.background = "#c8e6c9";
            statusBox.style.color = "#1b5e20";
            statusBox.innerText = `✅ Selamat Datang, ${namaSiswa}!`;

            bicara(`Selamat datang, ${namaSiswa}`);
            kirimPresensi(namaSiswa, kelasSiswa);

            // Buka kunci dalam 2 detik agar SISWA LAIN bisa langsung scan tanpa nunggu lama
            setTimeout(() => {
              isProcessing = false;
              statusBox.style.background = "#e8f5e9";
              statusBox.innerText = "Sistem Siap! Silakan berdiri di depan kamera.";
            }, 2000);

          } else {
            statusBox.style.background = "#fff3e0";
            statusBox.style.color = "#e65100";
            statusBox.innerText = "Wajah terdeteksi tapi belum dikenali. Pastikan kelas sudah sesuai.";
          }
        }
      }, 800);
    }

    function bicara(teks) {
      if ('speechSynthesis' in window) {
        const uttr = new SpeechSynthesisUtterance(teks);
        uttr.lang = 'id-ID';
        window.speechSynthesis.speak(uttr);
      }
    }

    async function kirimPresensi(nama, kelas) {
      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "presensi",
            nama: nama,
            kelas: kelas,
            status: "Hadir"
          })
        });
      } catch (err) {
        console.error("Gagal menyimpan ke spreadsheet:", err);
      }
    }

    window.onload = init;
  </script>
